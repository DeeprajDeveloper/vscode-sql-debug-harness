name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build docs CSS and sync version
        run: |
          npm exec --yes sass -- docs/scss/styles.scss:docs/scss/css/styles.css --style=compressed
          node -e "const p=require('./package.json');require('fs').writeFileSync('docs/version.json',JSON.stringify({version:p.version},null,2)+'\n')"

      - name: Generate PDF (optional)
        run: npm exec --yes md-to-pdf -- docs/TECHNICAL_DESIGN.md --config-file docs/md-to-pdf.config.js
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
