[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-debug"
version = "0.1.0"
description = "Transform MSSQL stored procedures into safe debug harness scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sqlglot>=25.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sp-debug = "sp_debug.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
